name: build-whisper-vulkan-windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout whisper.cpp
        uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp

      - name: Install Vulkan SDK
        run: |
          C:\msys64\usr\bin\wget.exe https://sdk.lunarg.com/sdk/download/1.3.290.0/windows/VulkanSDK-1.3.290.0-Installer.exe -O vulkan.exe
          .\vulkan.exe --root C:\vulkan --accept-licenses --default-answer --confirm-command install
          echo "VULKAN_SDK=C:\vulkan" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake -B build -DGGML_VULKAN=1 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j

      - name: Package
        run: |
          mkdir dist
          Copy-Item build\bin\Release\* dist\ -Recurse
          & "C:\Program Files\7-Zip\7z.exe" a -t7z -mx=9 whisper-vulkan-windows.7z .\dist\*

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: whisper.cpp Vulkan build ${{ github.run_number }}
          files: whisper-vulkan-windows.zip
